<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head><title>Legacy image-map fixture</title></head>
<body>
  <img src="pixel-board.jpg" usemap="#pixel-board">
  <map name="pixel-board" id="pixel-board">
    <area shape="rect" coords="0,0,10,10" href="https://example.invalid/one" title="First tile">
    <area shape="rect" coords="10,0,20,10" href="https://example.invalid/two" title="Second tile">
    <area shape="rect" coords="20,0,30,10" href="https://example.invalid/three" alt="Third tile">
  </map>
</body>
</html>
